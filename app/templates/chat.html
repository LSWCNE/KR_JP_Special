{% extends "base.html" %}
{% block title %}AI 채팅 - 한일문화교류서비스{% endblock %}
{% block nav_home %}active{% endblock %}
{% block content %}
<h1 data-i18n="chat.title">한일 문화교류 AI 채팅</h1>
<p class="subtitle" data-i18n="chat.subtitle">구글 폼으로 수집한 한국·일본 학생들의 실제 설문 응답을 근거로, 질문에 답하고 콘텐츠를 추천해드립니다.</p>

<div class="card">
  <label data-i18n="chat.category_label">카테고리 선택</label>
  <div class="choice-group" id="category-group"></div>
  <p class="hint" id="category-hint" style="margin-top:6px"></p>
  <div class="chat-log" id="chat-log"></div>
  <div style="display:flex; gap:8px;">
    <input type="text" id="chat-input" data-i18n-placeholder="chat.placeholder" placeholder="질문을 입력하세요">
    <button class="primary" style="margin-top:0" id="send-btn" data-i18n="chat.send">전송</button>
  </div>
  <p class="hint" id="chat-hint" style="margin-top:10px"></p>
</div>
{% endblock %}
{% block extra_script %}
<script>
const log = document.getElementById("chat-log");
const categoryGroup = document.getElementById("category-group");
const categoryHint = document.getElementById("category-hint");

let categories = [];       // [{key, ko, ja}, ...] — 서버에서 로드
let selectedCategory = null; // null = 전체(제한 없음)

function categoryLabel(cat) {
  return getLang() === "ja" ? cat.ja : cat.ko;
}

function renderCategoryPills() {
  categoryGroup.innerHTML = "";

  const allPill = document.createElement("span");
  allPill.className = "choice-pill" + (selectedCategory === null ? " selected" : "");
  allPill.textContent = t("chat.category_all");
  allPill.addEventListener("click", () => selectCategory(null));
  categoryGroup.appendChild(allPill);

  for (const cat of categories) {
    const pill = document.createElement("span");
    pill.className = "choice-pill" + (selectedCategory === cat.key ? " selected" : "");
    pill.textContent = categoryLabel(cat);
    pill.addEventListener("click", () => selectCategory(cat.key));
    categoryGroup.appendChild(pill);
  }

  updateCategoryHint();
}

function updateCategoryHint() {
  if (selectedCategory === null) {
    categoryHint.textContent = t("chat.category_hint_all");
    return;
  }
  const cat = categories.find(c => c.key === selectedCategory);
  const label = cat ? categoryLabel(cat) : selectedCategory;
  categoryHint.textContent = t("chat.category_hint_selected", { category: label });
}

function selectCategory(key) {
  selectedCategory = key;
  renderCategoryPills();
}

async function loadCategories() {
  try {
    categories = await api("/api/ai/categories");
  } catch (e) {
    categories = [];
  }
  renderCategoryPills();
  renderExampleHint();
}

function renderExampleHint() {
  const examples = categories
    .map(c => (getLang() === "ja" ? c.example_ja : c.example_ko))
    .filter(Boolean);
  document.getElementById("chat-hint").textContent = examples.length
    ? t("chat.example_prefix") + examples.map(q => `"${q}"`).join(" · ")
    : "";
}

document.addEventListener("kj-lang-changed", () => {
  renderCategoryPills();
  renderExampleHint();
});
loadCategories();

function appendMsg(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function setAiMsg(div, text) {
  div.innerHTML = renderMarkdown(text);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const input = document.getElementById("chat-input");
  const question = input.value.trim();
  if (!question) return;
  appendMsg("user", question);
  input.value = "";
  const aiMsg = appendMsg("ai", t("chat.generating"));

  try {
    const res = await api("/api/ai/chat", {
      method: "POST",
      body: JSON.stringify({ question, lang: getLang(), category: selectedCategory }),
    });
    setAiMsg(aiMsg, res.answer);
  } catch (e) {
    aiMsg.textContent = t("chat.error_prefix") + e.message;
  }
}

document.getElementById("send-btn").addEventListener("click", send);
document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
{% endblock %}
