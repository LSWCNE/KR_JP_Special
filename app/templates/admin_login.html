{% extends "base.html" %}
{% block title %}관리자 로그인 - 한일문화교류서비스{% endblock %}
{% block content %}
<h1 data-i18n="admin_login.title">관리자 로그인</h1>
<div class="card" style="max-width:360px">
  {% if error %}<p class="hint" style="color:#c00">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label data-i18n="admin_login.password_label">비밀번호</label>
    <input type="password" name="password" autofocus>
    <button class="primary" type="submit" style="margin-top:12px" data-i18n="admin_login.submit_btn">로그인</button>
  </form>
</div>
{% endblock %}
